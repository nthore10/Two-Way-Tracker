<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Two-Way Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --primary:#0A0A0A;--accent:#C8102E;--accent-light:#FFF0F2;--surface:#FFFFFF;
    --surface-2:#F5F4F0;--surface-3:#EDECEA;--ink:#0A0A0A;--ink-secondary:#5A5A5A;
    --ink-muted:#9A9A9A;--border:rgba(0,0,0,0.10);--border-strong:rgba(0,0,0,0.22);
    --success:#1A7A4A;--success-bg:#EBF8F1;--info:#1E5FA8;--info-bg:#EBF2FC;
    --warning:#A06B00;--warning-bg:#FEF6E0;
    --font-display:'Bebas Neue',sans-serif;--font-body:'DM Sans',sans-serif;--font-mono:'DM Mono',monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:var(--font-body);background:var(--surface-2);color:var(--ink);min-height:100vh;}
  .masthead{background:var(--primary);padding:20px 24px 18px;display:flex;align-items:center;justify-content:center;text-align:center;border-bottom:3px solid var(--accent);}
  .masthead-wordmark{font-family:var(--font-display);font-size:32px;color:#fff;letter-spacing:1.5px;line-height:1;}
  .masthead-wordmark span{color:var(--accent);}
  .masthead-sub{font-family:var(--font-mono);font-size:10px;color:rgba(255,255,255,0.45);letter-spacing:2px;padding-bottom:3px;}
  .search-bar{padding:14px 24px;background:var(--surface);border-bottom:1px solid var(--border);}
  .search-bar input{font-family:var(--font-body);font-size:13px;padding:8px 14px;border:1px solid var(--border-strong);border-radius:6px;background:var(--surface);color:var(--ink);outline:none;width:100%;max-width:400px;transition:border-color .15s;}
  .search-bar input:focus{border-color:var(--accent);}
  .loading{text-align:center;padding:80px 20px;}
  .loading-spinner{width:36px;height:36px;border:3px solid var(--surface-3);border-top:3px solid var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading p{font-family:var(--font-mono);font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--ink-muted);}
  .container{max-width:1400px;margin:0 auto;padding:20px 16px;}
  .team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px;}
  .team-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
  .team-header{padding:16px 18px;background:var(--surface);border-bottom:2px solid var(--accent);display:flex;align-items:center;gap:12px;}
  .team-logo-wrap{width:40px;height:40px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .team-logo-wrap img{width:100%;height:100%;object-fit:contain;}
  .team-info{flex:1;}
  .team-name{font-family:var(--font-display);font-size:20px;letter-spacing:.5px;color:var(--ink);line-height:1.1;}
  .conf-badge{display:inline-block;font-family:var(--font-mono);font-size:8px;letter-spacing:1.5px;text-transform:uppercase;padding:2px 7px;border-radius:3px;margin-top:3px;}
  .conf-badge.east{background:var(--info-bg);color:var(--info);}
  .conf-badge.west{background:var(--accent-light);color:var(--accent);}
  .under15-box{text-align:right;}
  .under15-value{font-family:var(--font-display);font-size:28px;color:var(--accent);line-height:1;}
  .under15-label{font-family:var(--font-mono);font-size:8px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-muted);}
  .players-list{padding:12px;}
  .player-row{display:flex;align-items:center;padding:12px;border-radius:6px;margin-bottom:8px;background:var(--surface-2);transition:background .15s;}
  .player-row:last-child{margin-bottom:0;}
  .player-row:hover{background:var(--surface-3);}
  .player-info{flex:1;}
  .player-name{font-weight:600;font-size:14px;margin-bottom:3px;}
  .player-details{font-family:var(--font-mono);font-size:10px;color:var(--ink-muted);}
  .player-stats{text-align:right;}
  .games-count{font-family:var(--font-display);font-size:24px;line-height:1;}
  .games-label{font-family:var(--font-mono);font-size:10px;color:var(--ink-muted);}
  .progress-bar{width:100%;height:5px;background:var(--surface-3);border-radius:3px;margin-top:8px;overflow:hidden;}
  .progress-fill{height:100%;border-radius:3px;}
  .progress-fill.safe{background:var(--info);}
  .progress-fill.good{background:var(--success);}
  .progress-fill.warning{background:var(--warning);}
  .progress-fill.danger{background:var(--accent);}
  .games-count.safe{color:var(--info);}
  .games-count.good{color:var(--success);}
  .games-count.warning{color:var(--warning);}
  .games-count.danger{color:var(--accent);}
  .empty-state{text-align:center;padding:60px;color:var(--ink-muted);font-family:var(--font-mono);font-size:11px;letter-spacing:2px;text-transform:uppercase;}
  @media(max-width:768px){.team-grid{grid-template-columns:1fr;}}
</style>
</head>
<body>

<div class="masthead">
  <div class="masthead-wordmark">TWO-WAY <span>TRACKER</span></div>
  
</div>

<div class="search-bar">
  <input type="text" id="searchInput" placeholder="Search players or teams...">
</div>

<div class="container">
  <div id="content">
    <div class="loading">
      <div class="loading-spinner"></div>
      <p>Fetching data...</p>
    </div>
  </div>
</div>

<script>
const CSV_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vRTwTOS_rNBYI8d8zDUivGFWXsXcxlOZgrqn5o-WCvFC5aNAR3vLsSqllE7aO0BRw/pub?gid=164590079&single=true&output=csv';
const nbaIds={ATL:1610612737,BOS:1610612738,BKN:1610612751,CHA:1610612766,CHI:1610612741,CLE:1610612739,DAL:1610612742,DEN:1610612743,DET:1610612765,GSW:1610612744,HOU:1610612745,IND:1610612754,LAC:1610612746,LAL:1610612747,MEM:1610612763,MIA:1610612748,MIL:1610612749,MIN:1610612750,NOP:1610612740,NYK:1610612752,OKC:1610612760,ORL:1610612753,PHI:1610612755,PHX:1610612756,POR:1610612757,SAC:1610612758,SAS:1610612759,TOR:1610612761,UTA:1610612762,WAS:1610612764};
function logoUrl(abbr){const id=nbaIds[abbr];return id?`https://cdn.nba.com/logos/nba/${id}/global/L/logo.svg`:'';}
const TEAM_CONFERENCES={ATL:'east',BOS:'east',BKN:'east',CHA:'east',CHI:'east',CLE:'east',DET:'east',IND:'east',MIA:'east',MIL:'east',NYK:'east',ORL:'east',PHI:'east',TOR:'east',WAS:'east',DAL:'west',DEN:'west',GSW:'west',HOU:'west',LAC:'west',LAL:'west',MEM:'west',MIN:'west',NOP:'west',OKC:'west',PHX:'west',POR:'west',SAC:'west',SAS:'west',UTA:'west'};
const TEAM_NAMES={ATL:'Atlanta Hawks',BOS:'Boston Celtics',BKN:'Brooklyn Nets',CHA:'Charlotte Hornets',CHI:'Chicago Bulls',CLE:'Cleveland Cavaliers',DAL:'Dallas Mavericks',DEN:'Denver Nuggets',DET:'Detroit Pistons',GSW:'Golden State Warriors',HOU:'Houston Rockets',IND:'Indiana Pacers',LAC:'Los Angeles Clippers',LAL:'Los Angeles Lakers',MEM:'Memphis Grizzlies',MIA:'Miami Heat',MIL:'Milwaukee Bucks',MIN:'Minnesota Timberwolves',NOP:'New Orleans Pelicans',NYK:'New York Knicks',OKC:'Oklahoma City Thunder',ORL:'Orlando Magic',PHI:'Philadelphia 76ers',PHX:'Phoenix Suns',POR:'Portland Trail Blazers',SAC:'Sacramento Kings',SAS:'San Antonio Spurs',TOR:'Toronto Raptors',UTA:'Utah Jazz',WAS:'Washington Wizards'};

let TWO_WAY_DATA={},searchQuery='';

function getStatus(pct){if(pct>=76)return'danger';if(pct>=51)return'warning';if(pct>=26)return'good';return'safe';}

function parseCSVLine(line){const r=[];let cur='',inQ=false;for(let i=0;i<line.length;i++){const c=line[i];if(inQ){if(c==='"'&&line[i+1]==='"'){cur+='"';i++;}else if(c==='"')inQ=false;else cur+=c;}else{if(c==='"')inQ=true;else if(c===','){r.push(cur);cur='';}else cur+=c;}}r.push(cur);return r;}

function parseCSV(text){
  TWO_WAY_DATA={};
  const lines=text.split('\n');
  for(let i=1;i<lines.length;i++){
    const line=lines[i].trim();if(!line)continue;
    const cols=parseCSVLine(line);if(cols.length<7)continue;
    const teamAbbr=cols[0]?.trim(),teamName=cols[1]?.trim(),playerName=cols[2]?.trim();
    const effectiveDate=cols[3]?.trim(),gamesActive=parseInt(cols[4])||0,gamesAllowed=parseInt(cols[5])||50,gamesRemaining=parseInt(cols[6])||0;
    const remainingUnder15=parseInt(cols[8])||0;
    if(!teamAbbr||!playerName||teamAbbr==='Team Abbr'||teamAbbr.length>3)continue;
    if(!TWO_WAY_DATA[teamAbbr]){TWO_WAY_DATA[teamAbbr]={name:teamName||TEAM_NAMES[teamAbbr]||teamAbbr,conf:TEAM_CONFERENCES[teamAbbr]||'east',remainingUnder15,players:[]};}
    if(remainingUnder15>0)TWO_WAY_DATA[teamAbbr].remainingUnder15=remainingUnder15;
    TWO_WAY_DATA[teamAbbr].players.push({name:playerName,gamesPlayed:gamesActive,gamesAllowed,gamesRemaining,effectiveDate:effectiveDate||''});
  }
}

function renderTeams(){
  const content=document.getElementById('content');
  let teams=Object.entries(TWO_WAY_DATA).sort((a,b)=>a[1].name.localeCompare(b[1].name));
  if(searchQuery){const q=searchQuery.toLowerCase();teams=teams.filter(([abbr,d])=>d.name.toLowerCase().includes(q)||abbr.toLowerCase().includes(q)||d.players.some(p=>p.name.toLowerCase().includes(q)));}
  if(!teams.length){content.innerHTML='<div class="empty-state">No teams found</div>';return;}
  let html='<div class="team-grid">';
  for(const[abbr,team]of teams){
    const logo=logoUrl(abbr);
    html+=`<div class="team-card">
      <div class="team-header">
        <div class="team-logo-wrap"><img src="${logo}" alt="${abbr}" onerror="this.style.display='none'"></div>
        <div class="team-info">
          <div class="team-name">${team.name}</div>
          <span class="conf-badge ${team.conf}">${team.conf.toUpperCase()}</span>
        </div>
        <div class="under15-box">
          <div class="under15-value">${team.remainingUnder15||0}</div>
          <div class="under15-label">Under 15 Left</div>
        </div>
      </div>
      <div class="players-list">`;
    const sorted=[...team.players].sort((a,b)=>(b.gamesPlayed/b.gamesAllowed)-(a.gamesPlayed/a.gamesAllowed));
    for(const p of sorted){
      const pct=(p.gamesPlayed/p.gamesAllowed)*100;
      const status=getStatus(pct);
      html+=`<div class="player-row">
        <div class="player-info">
          <div class="player-name">${p.name}</div>
          <div class="player-details">${p.gamesRemaining} games remaining · Signed ${p.effectiveDate}</div>
          <div class="progress-bar"><div class="progress-fill ${status}" style="width:${Math.min(pct,100)}%"></div></div>
        </div>
        <div class="player-stats">
          <div class="games-count ${status}">${p.gamesPlayed}</div>
          <div class="games-label">of ${p.gamesAllowed} (${Math.round(pct)}%)</div>
        </div>
      </div>`;
    }
    html+=`</div></div>`;
  }
  html+='</div>';
  content.innerHTML=html;
}

document.addEventListener('DOMContentLoaded',async()=>{
  try{
    const resp=await fetch(CSV_URL);
    if(!resp.ok)throw new Error('HTTP '+resp.status);
    parseCSV(await resp.text());
    renderTeams();
    document.getElementById('searchInput').addEventListener('input',e=>{searchQuery=e.target.value;renderTeams();});
  }catch(err){
    document.getElementById('content').innerHTML=`<div class="empty-state">Unable to load data: ${err.message}</div>`;
  }
});
</script>
</body>
</html>
